name: Check

# Checks the tools, the metadata of the tests and the pinned UVM library, and
# runs the tests whose expected output was recorded with Verilator 5.052
# (`verilator@5.052` in :oracle:) with that release and two seeds. Every one
# of them must match: the release and the library do not change, so a test
# that does not points to a problem in the suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and check the UVM library
        run: python3 tools/fetch_uvm.py

      - name: Unit tests of the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Metadata of the tests
        run: python3 tools/lint_metadata.py

  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restored and saved in separate steps, so that the build is kept even
      # when the tests then fail the job.
      - name: Restore Verilator 5.052
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verilator
          key: verilator-v5.052-ubuntu-24.04

      - name: Build Verilator 5.052
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y help2man autoconf flex bison libfl-dev zlib1g-dev
          git clone -q --depth 1 --branch v5.052 https://github.com/verilator/verilator.git \
            "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          autoconf
          ./configure -q --prefix="$HOME/verilator"
          make -s -j"$(nproc)"
          make -s install

      - name: Save Verilator 5.052
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verilator
          key: verilator-v5.052-ubuntu-24.04

      # No ccache: the model of a UVM test is built with a precompiled header
      # that records the absolute path of its build directory (see
      # tools/run_verilator.py).
      - name: Put Verilator on the path
        run: echo "$HOME/verilator/bin" >> "$GITHUB_PATH"

      - name: Fetch the UVM library
        run: python3 tools/fetch_uvm.py

      - name: Tests recorded with Verilator 5.052, seed 1
        run: python3 tools/run_verilator.py --seed 1 -j 2

      - name: Tests recorded with Verilator 5.052, seed 73
        run: python3 tools/run_verilator.py --seed 73 -j 2
