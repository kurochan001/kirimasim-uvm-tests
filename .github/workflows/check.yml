name: Check

# Checks the tools, the metadata of the tests and the pinned UVM library, and
# runs the tagged Verilator 5.052 checks (`verilator@5.052` in :oracle:) whose
# recorded inputs changed, plus a fixed canary (tools/ci_select.py). Runtime
# cases use two seeds; illegal elaboration cases require compiler rejection
# with the declared diagnostic and do not run a binary. Each expectation must
# match the fixed simulator/library condition. The tools job also checks the
# record of causes of the known differences (coverage/known_causes.json), and
# the Verilator job rebuilds its simulator reproducers (tools/known_causes.py).
#
# This quick check does not replace the full selection: the whole tagged set
# and the explicit command-line checks run in the Regression workflow
# (regression.yml). When the base is unknown, a file that affects every result
# changed, or too many checks are affected, only the canary runs and a warning
# asks for Regression.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Revision whose inputs the changed checks are compared with
        required: false
        default: HEAD^

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and check the UVM library
        run: python3 tools/fetch_uvm.py

      - name: Unit tests of the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Metadata of the tests
        run: python3 tools/lint_metadata.py

      - name: Draft requirement ledger and test index
        run: python3 tools/requirements.py check

      - name: Causes of the known differences
        run: python3 tools/known_causes.py check

  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The whole history, so that the base revision can be compared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-verilator

      - name: Select the tagged checks whose inputs changed
        env:
          # A pull request is checked out as a merge commit on its base.
          BASE: >-
            ${{ github.event_name == 'push' && github.event.before
                || github.event_name == 'pull_request' && github.event.pull_request.base.sha
                || inputs.base }}
        run: python3 tools/ci_select.py --base "$BASE" --output out/verilator-changed.paths

      - name: Selected Verilator checks (runtime seeds 1 and 73)
        run: |
          mapfile -t cases < out/verilator-changed.paths
          test "${#cases[@]}" -gt 0
          python3 tools/run_verilator.py --seeds 1 73 --build-jobs 2 -j 2 \
            --json out/verilator-changed.json "${cases[@]}"

      # Each simulator cause of a known difference names a reproducer without
      # UVM; Verilator must still accept or reject it as the record says.
      - name: Simulator reproducers of the known differences
        run: python3 tools/known_causes.py reproduce
